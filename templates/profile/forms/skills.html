{% if profile_type == 'student' %}
<form method="post" action="{{ url_for('user.update_student_skills') }}" class="mt-1">
  <label class="form-label">Skills</label>
  <textarea class="form-control" name="skills" rows="4">{{ user.skills or '' }}</textarea>
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
<form method="post" action="{{ url_for('user.delete_student_skills') }}" class="mt-2">
  <button class="btn btn-outline-danger" type="submit">Delete</button>
</form>
{% elif profile_type == 'employee' %}
<form method="post" action="{{ url_for('employee.update_employee_skills') }}" class="mt-1">
  <label class="form-label">Skills</label>
  <textarea class="form-control" name="skills" rows="4">{{ user.skills or '' }}</textarea>
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
<form method="post" action="{{ url_for('employee.delete_employee_skills') }}" class="mt-2">
  <button class="btn btn-outline-danger" type="submit">Delete</button>
</form>
{% endif %}
