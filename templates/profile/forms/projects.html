<form method="post" action="{{ url_for('employee.create_employee_project') if profile_type == 'employee' else url_for('user.create_student_project') }}" class="row g-3 mt-1 border rounded p-3 mb-3">
  <div class="col-md-6"><label class="form-label">Project Title</label><input class="form-control" name="title"></div>
  <div class="col-md-6"><label class="form-label">Role</label><input class="form-control" name="role_name"></div>
  <div class="col-md-6"><label class="form-label">Start Date</label><input type="date" class="form-control" name="start_date"></div>
  <div class="col-md-6"><label class="form-label">End Date</label><input type="date" class="form-control" name="end_date"></div>
  <div class="col-12"><label class="form-label">Technologies</label><textarea class="form-control" name="technologies" rows="2"></textarea></div>
  <div class="col-12"><label class="form-label">Project URL</label><input class="form-control" name="project_url"></div>
  <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
  <div class="col-12"><button class="btn btn-primary" type="submit">Save</button></div>
</form>

{% for project in projects %}
<form method="post" action="{{ url_for('employee.edit_employee_project', project_id=project.id) if profile_type == 'employee' else url_for('user.edit_student_project', project_id=project.id) }}" class="row g-3 border rounded p-3 mb-3">
  <div class="col-md-6"><label class="form-label">Project Title</label><input class="form-control" name="title" value="{{ project.title }}"></div>
  <div class="col-md-6"><label class="form-label">Role</label><input class="form-control" name="role_name" value="{{ project.role_name or '' }}"></div>
  <div class="col-md-6"><label class="form-label">Start Date</label><input type="date" class="form-control" name="start_date" value="{{ project.start_date }}"></div>
  <div class="col-md-6"><label class="form-label">End Date</label><input type="date" class="form-control" name="end_date" value="{{ project.end_date }}"></div>
  <div class="col-12"><label class="form-label">Technologies</label><textarea class="form-control" name="technologies" rows="2">{{ project.technologies or '' }}</textarea></div>
  <div class="col-12"><label class="form-label">Project URL</label><input class="form-control" name="project_url" value="{{ project.project_url or '' }}"></div>
  <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3">{{ project.description or '' }}</textarea></div>
  <div class="col-12 d-flex gap-2">
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
<form method="post" action="{{ url_for('employee.delete_employee_project', project_id=project.id) if profile_type == 'employee' else url_for('user.delete_student_project', project_id=project.id) }}" class="mb-3">
  <button class="btn btn-outline-danger btn-sm" type="submit">Delete Project</button>
</form>
{% endfor %}
