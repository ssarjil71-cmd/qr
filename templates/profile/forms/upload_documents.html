<form method="post" action="{{ url_for('user.upload_student_document') }}" enctype="multipart/form-data" class="row g-3 mt-1 border rounded p-3 mb-3">
  <div class="col-md-6">
    <label class="form-label">Document Type</label>
    <select class="form-select" name="document_type" required>
      <option value="">Select document</option>
      <option value="caste_certificate">Caste Certificate</option>
      <option value="domicile">Domicile Certificate</option>
      <option value="nationality">Nationality Certificate</option>
      <option value="mark_sheet">Mark Sheet</option>
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Title</label>
    <input class="form-control" name="title" placeholder="Example: Semester 1 Mark Sheet">
  </div>
  <div class="col-md-8">
    <label class="form-label">PDF Document</label>
    <input class="form-control" type="file" name="document_file" accept="application/pdf,.pdf" required>
    <div class="form-text">Only PDF files are allowed.</div>
  </div>
  <div class="col-md-4">
    <label class="form-label">Notes</label>
    <input class="form-control" name="notes" placeholder="Optional">
  </div>
  <div class="col-12">
    <button class="btn btn-primary" type="submit">Save</button>
  </div>
</form>
