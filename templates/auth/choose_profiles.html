{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-1">Choose Your Profile</h3>
        <p class="text-muted">Select one or more profiles that match you.</p>
        <form method="post">
          <div class="row g-3">
            {% for profile in profile_options %}
            <div class="col-md-6">
              <button type="button" class="profile-option-btn btn w-100 text-start border rounded p-3 {% if profile in selected_profiles %}btn-primary text-white{% else %}btn-outline-primary{% endif %}" data-value="{{ profile }}">
                <div class="d-flex justify-content-between align-items-center">
                  <span class="fw-semibold">{{ profile_labels[profile] }}</span>
                  <i class="bi {% if profile in selected_profiles %}bi-check-circle-fill{% else %}bi-circle{% endif %}"></i>
                </div>
              </button>
              <input type="hidden" name="profiles" value="{{ profile }}" {% if profile not in selected_profiles %}disabled{% endif %}>
            </div>
            {% endfor %}
          </div>
          <div class="mt-4 d-flex justify-content-between">
            <a class="btn btn-outline-secondary" href="{{ url_for('auth.register') }}">Back</a>
            <button class="btn btn-primary" type="submit">Continue</button>
          </div>
        </form>
        <script>
          document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.profile-option-btn').forEach(function (button) {
              button.addEventListener('click', function () {
                const isSelected = button.classList.contains('btn-primary');

                document.querySelectorAll('.profile-option-btn').forEach(function (otherButton) {
                  const otherInput = otherButton.parentElement.querySelector('input[name="profiles"]');
                  otherButton.classList.remove('btn-primary', 'text-white');
                  otherButton.classList.add('btn-outline-primary');
                  otherButton.querySelector('i').className = 'bi bi-circle';
                  otherInput.disabled = true;
                  otherInput.value = '';
                });

                if (!isSelected) {
                  button.classList.remove('btn-outline-primary');
                  button.classList.add('btn-primary', 'text-white');
                  button.querySelector('i').className = 'bi bi-check-circle-fill';
                  const hiddenInput = button.parentElement.querySelector('input[name="profiles"]');
                  hiddenInput.disabled = false;
                  hiddenInput.value = button.dataset.value;
                }
              });
            });
          });
        </script>
      </div>
    </div>
  </div>
</div>
{% endblock %}
