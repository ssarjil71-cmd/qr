{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-3">
  <div class="col-md-6">
    <div class="auth-card p-4 p-lg-5">
      <div class="auth-brand mb-4">
        <img src="{{ url_for('static', filename='img/qr-nexid-logo.png') }}" alt="QR-NexID - Scan Me, Know Me">
      </div>
      <h3 class="fw-bold mb-2">Forgot Password</h3>
      <p class="text-muted mb-4">Enter your registered mobile number to receive an OTP.</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Registered Mobile Number</label>
          <input class="form-control" name="mobile" placeholder="e.g. 9876543210" required>
        </div>
        <button class="btn btn-primary w-100 mb-3">Send OTP</button>
        <div class="text-center">
          <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
