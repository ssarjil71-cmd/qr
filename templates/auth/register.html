{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h3>Register</h3>
    <form method="post" enctype="multipart/form-data">
      <div class="mb-3"><label>Name</label><input class="form-control" name="name" required></div>
      <div class="mb-3"><label>Email</label><input class="form-control" name="email" type="email" required></div>
      <div class="mb-3"><label>Mobile</label><input class="form-control" name="mobile" required></div>
      <div class="mb-3"><label>Password</label><input class="form-control" name="password" type="password" required></div>
      <div class="mb-3"><label>Confirm Password</label><input class="form-control" name="confirm_password" type="password" required></div>
      <div class="mb-3"><label>User Type</label>
        <select class="form-select" name="user_type">
          <option value="student">Student</option>
          <option value="employee">Employee</option>
          <option value="emergency">Emergency</option>
        </select>
      </div>
      <button class="btn btn-success">Register</button>
    </form>
  </div>
</div>
{% endblock %}
