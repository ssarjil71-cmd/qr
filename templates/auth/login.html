{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-3">
  <div class="col-md-6">
    <div class="auth-card p-4 p-lg-5">
      <div class="auth-brand mb-4">
        <img src="{{ url_for('static', filename='img/qr-nexid-logo.png') }}" alt="QR-NexID - Scan Me, Know Me">
      </div>
      <h3 class="fw-bold mb-2">Login</h3>
      <p class="text-muted mb-4">Use your mobile number or email and password to continue.</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Mobile Number / Email</label>
          <input class="form-control" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" name="password" type="password" required>
        </div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
