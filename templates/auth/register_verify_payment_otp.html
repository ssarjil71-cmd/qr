{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-3">
  <div class="col-lg-5">
    <div class="auth-card p-4 p-lg-5">
      <img class="auth-page-logo mb-3" src="{{ url_for('static', filename='img/qr-nexid-logo.png') }}" alt="QR-NexID - Scan Me, Know Me">
      <div class="nexid-badge mb-3"><i class="bi bi-shield-check"></i> OTP Sent</div>
      <h3 class="fw-bold mb-2">Enter OTP</h3>
      <p class="text-muted mb-3">MSG91 OTP sent to <strong>{{ attempt.mobile }}</strong> for {{ user_label }} registration.</p>
      <div class="alert alert-info py-2">Registration Fee: <strong>₹{{ '%.0f'|format(attempt.amount_rupees) }}</strong></div>
      <div class="alert alert-warning py-2 small">Temporary testing OTP: <strong>1111</strong></div>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">MSG91 OTP</label>
          <input class="form-control" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="4" required>
        </div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-check2-circle me-1"></i> Verify OTP</button>
      </form>
      <form class="mt-3" method="post" action="{{ url_for('auth.registration_resend_otp') }}">
        <button class="btn btn-outline-primary w-100" id="resendOtpBtn" type="submit" disabled>
          Resend OTP <span id="resendTimer">(30s)</span>
        </button>
      </form>
      <a class="btn btn-link w-100 mt-2" href="{{ url_for('auth.registration_mobile') }}">Change mobile number</a>
    </div>
  </div>
</div>
<script>
  const resendButton = document.getElementById('resendOtpBtn');
  const resendTimer = document.getElementById('resendTimer');
  let remaining = 30;
  const tick = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(tick);
      resendButton.disabled = false;
      resendTimer.textContent = '';
      return;
    }
    resendTimer.textContent = `(${remaining}s)`;
  }, 1000);
</script>
{% endblock %}
