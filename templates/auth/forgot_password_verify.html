{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-3">
  <div class="col-md-6">
    <div class="auth-card p-4 p-lg-5">
      <div class="auth-brand mb-4">
        <img src="{{ url_for('static', filename='img/qr-nexid-logo.png') }}" alt="QR-NexID - Scan Me, Know Me">
      </div>
      <h3 class="fw-bold mb-2">Verify OTP</h3>
      <p class="text-muted mb-4">OTP has been sent to <strong>{{ mobile }}</strong>. Enter it below.</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">OTP</label>
          <input class="form-control" name="otp" inputmode="numeric" maxlength="6" required>
        </div>
        <button class="btn btn-primary w-100 mb-3">Verify OTP</button>
        <div class="d-flex justify-content-between align-items-center">
          <form method="post" action="{{ url_for('auth.forgot_password_resend') }}">
            <button class="btn btn-link p-0" type="submit">Resend OTP</button>
          </form>
          <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none">Change Number</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
