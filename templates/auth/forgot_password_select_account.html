{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-3">
  <div class="col-lg-6 col-md-8">
    <div class="auth-card p-4 p-lg-5">
      <div class="auth-brand mb-4">
        <img src="{{ url_for('static', filename='img/qr-nexid-logo.png') }}" alt="QR-NexID - Scan Me, Know Me">
      </div>
      <h3 class="fw-bold mb-2">Select Account</h3>
      <p class="text-muted mb-4">We found multiple accounts for <strong>{{ mobile }}</strong>. Which account do you want to reset?</p>
      <form method="post">
        {% for account in accounts %}
        <div class="card mb-3 border-0 shadow-sm">
          <div class="card-body p-3">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="account_id" value="{{ account.id }}" id="account_{{ account.id }}" required>
              <label class="form-check-label d-block" for="account_{{ account.id }}">
                <strong>{{ account.name or 'Unnamed User' }}</strong><br>
                <small class="text-muted">{{ account.user_type|title }} • {{ account.email or 'No email' }}</small>
              </label>
            </div>
          </div>
        </div>
        {% endfor %}
        <button class="btn btn-primary w-100 mb-3">Continue</button>
        <div class="text-center">
          <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none">Back</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
