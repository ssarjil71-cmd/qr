{% extends 'admin/superadmin/layout.html' %}
{% block superadmin_content %}
<div class="card shadow-sm border-0">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="mb-1">Create Organization Admin</h3>
        <p class="text-muted mb-0">{{ org.name }}</p>
      </div>
      <a class="btn btn-outline-secondary" href="{{ url_for('superadmin.organization_view', org_id=org.id) }}">Back</a>
    </div>
    <form method="post" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Name</label>
        <input class="form-control" name="name" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input class="form-control" name="email" type="email" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Mobile</label>
        <input class="form-control" name="mobile">
      </div>
      <div class="col-md-6">
        <label class="form-label">Password</label>
        <input class="form-control" name="password" type="password" required>
      </div>
      <div class="col-12">
        <label class="form-label">Address</label>
        <textarea class="form-control" name="address" rows="3"></textarea>
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Create Organization Admin</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
